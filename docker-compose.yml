version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: certiflow_db
    restart: always
    environment:
      POSTGRES_USER: certiflow_user
      POSTGRES_PASSWORD: certiflow_password
      POSTGRES_DB: certiflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U certiflow_user -d certiflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: certiflow_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: "CertiFlow - Bulk Certificate Generator API"
      DATABASE_URL: postgresql://certiflow_user:certiflow_password@db:5432/certiflow_db
      DEBUG: "false"
    ports:
      - "8000:8000"
    volumes:
      - ./generated:/app/generated
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
